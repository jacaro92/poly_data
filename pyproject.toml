[project]
name = "poly-data"
version = "0.1.0"
description = "A comprehensive data pipeline for fetching, processing, and analyzing Polymarket trading data"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Warproxxx", email = "" }
]

dependencies = [
    "pandas>=2.0.0",
    "polars>=0.19.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "web3>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "notebook>=7.0.0",
    "ipykernel>=6.25.0",
]
trading = [
    # CLOB V2: el paquete viejo py-clob-client quedó obsoleto tras la migración
    # del 28-abr-2026 (EIP-712 domain version 1→2 → "invalid order version").
    "py-clob-client-v2>=1.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["poly_utils", "update_utils", "trading"]

[tool.uv]
dev-dependencies = []
