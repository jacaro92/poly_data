services:
  # Un solo contenedor con los tres procesos (pipeline + trader + dashboard),
  # misma topología que Railway (un servicio, un volumen).
  # Desactivables con RUN_TRADER=false / RUN_DASHBOARD=false en .env.
  poly-data:
    build: .
    container_name: poly-data
    env_file: .env
    # El DNS de la red local (router Starlink) devuelve una IP secuestrada para
    # *.polymarket.com — DNS públicos evitan el bloqueo.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "8050:8050"   # dashboard → http://localhost:8050
    volumes:
      # Único volumen: CSVs, cursores de resume y processed/ (via symlink)
      - ./data:/app/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
